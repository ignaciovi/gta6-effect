name: Collect & deploy

on:
  schedule:
    - cron: "*/30 * * * *"   # GitHub may start scheduled runs a few minutes late
  workflow_dispatch:
  push:
    branches: [main]

# One run at a time: runs queue instead of racing to push the data branch.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r collector/requirements.txt

      - name: Collect metrics
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          CLOUDFLARE_RADAR_TOKEN: ${{ secrets.CLOUDFLARE_RADAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python collector/main.py

      - name: Refresh Twitch estimate (every 6 hours)
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          age=$(python -c "import json,time,calendar; u=json.load(open('data/twitch_vod.json'))['updated']; print(int(time.time()-calendar.timegm(time.strptime(u,'%Y-%m-%dT%H:%M:%SZ'))))" 2>/dev/null || echo 999999)
          if [ "$age" -gt 21000 ]; then python collector/twitch_backfill.py; else echo "estimate is ${age}s old, skipping"; fi

      - name: Commit data
        working-directory: data
        run: |
          git config user.name "gta6-effect-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin HEAD:data

      - name: Build site
        run: |
          mkdir -p _site/data
          cp -R site/. _site/
          rm -rf _site/data && mkdir -p _site/data
          cp data/*.json _site/data/
          # cache-bust CSS/JS on every deploy
          sed -i -E "s/(style\.css|app\.js)\?v=[0-9]+/\1?v=${GITHUB_RUN_NUMBER}/g" _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
